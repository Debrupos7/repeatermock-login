name: RepeaterMock Login + Browse

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright httpx
          python -m playwright install chromium

      - name: Run login script
        env:
          RM_EMAIL: ${{ secrets.RM_EMAIL }}
          RM_PASSWORD: ${{ secrets.RM_PASSWORD }}
          OUTPUT_DIR: ${{ github.workspace }}/output
        run: |
          mkdir -p output
          python repeatermock_login.py

      - name: Verify login
        if: always()
        run: |
          if [ ! -f output/cookies.json ]; then echo "No cookies.json"; exit 1; fi
          ACCESS_TOKEN=$(python -c "import json; d=json.load(open('output/cookies.json')); print(next((c['value'] for c in d['cookies'] if c['name']=='accessToken'), ''))")
          if [ -z "$ACCESS_TOKEN" ]; then echo "No accessToken"; exit 1; fi
          echo "accessToken obtained"
          curl -s https://api.repeatermock.com/auth/me -H "Cookie: accessToken=$ACCESS_TOKEN" | python -m json.tool

      - name: Print run log
        if: always()
        run: cat output/run_log.txt 2>/dev/null || echo "(no log)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeatermock-output
          path: output/
          retention-days: 7
