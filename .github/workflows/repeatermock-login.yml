name: RepeaterMock Login + Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx

      - name: Run login + scrape script
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          RM_EMAIL: ${{ secrets.RM_EMAIL }}
          RM_PASSWORD: ${{ secrets.RM_PASSWORD }}
          OUTPUT_DIR: ${{ github.workspace }}/output
        run: |
          mkdir -p output
          python repeatermock_login.py

      - name: Print run log
        if: always()
        run: cat output/run_log.txt 2>/dev/null || echo "(no log)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeatermock-output
          path: output/
          retention-days: 7
