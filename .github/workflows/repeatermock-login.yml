name: RepeaterMock Login + Browse

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install system dependencies"
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xvfb
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get install -f -y
          rm /tmp/chrome.deb
          google-chrome-stable --version

      - name: "Install Python dependencies"
        run: pip install nodriver httpx

      - name: "Run login + browse script"
        env:
          RM_EMAIL: ${{ secrets.RM_EMAIL }}
          RM_PASSWORD: ${{ secrets.RM_PASSWORD }}
          CHROME_PATH: /usr/bin/google-chrome-stable
          OUTPUT_DIR: ${{ github.workspace }}/output
        run: |
          mkdir -p output
          Xvfb :99 -screen 0 1280x900x24 -ac -nolisten unix &
          XVFB_PID=$!
          sleep 2
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY"
          python repeatermock_login.py
          EXIT_CODE=$?
          kill $XVFB_PID 2>/dev/null || true
          exit $EXIT_CODE

      - name: "Verify login"
        if: always()
        run: |
          if [ ! -f output/cookies.json ]; then
            echo "No cookies.json"
            exit 1
          fi
          ACCESS_TOKEN=$(python -c "import json; d=json.load(open('output/cookies.json')); print(next((c['value'] for c in d['cookies'] if c['name']=='accessToken'), ''))")
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "No accessToken"
            exit 1
          fi
          echo "accessToken obtained"
          curl -s https://api.repeatermock.com/auth/me \
            -H "Cookie: accessToken=$ACCESS_TOKEN" | python -m json.tool

      - name: "Print run log"
        if: always()
        run: cat output/run_log.txt 2>/dev/null || echo "(no log)"

      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeatermock-output
          path: output/
          retention-days: 7

      - name: "Clean up"
        if: always()
        run: rm -rf output/ /tmp/ts_profile
